[package]
name = "grab"
version = "0.3.0"
description = "Grab - a calm, dense desktop media downloader built on yt-dlp"
authors = ["Aleksandre Bakhtadze"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "grab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "process"] }
thiserror = "2"
regex = "1"
once_cell = "1"
# Same reqwest/rustls configuration tauri-plugin-updater uses, so this adds no
# second TLS stack. Used only to read Spotify's public embed pages.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
