name: Build Windows installer

# Two modes:
#   - workflow_dispatch: build + upload the installers as a workflow artifact (no release).
#   - push of a v* tag:  build, sign, create a GitHub Release with the .exe/.msi, their
#                        .sig files and latest.json — which is what the in-app updater reads.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch yt-dlp and ffmpeg sidecars
        run: npm run sidecars

      - name: Generate icons (only if the repo doesn't ship them)
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/icons/icon.ico)) { npm run tauri icon ./app-icon.png }

      # ---- Tagged release: build, sign, publish (updater-ready) ----
      - name: Build, sign and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Grab ${{ github.ref_name }}"
          releaseBody: |
            **Windows:** download `Grab_*_x64-setup.exe` (per-user install, no admin needed).
            Existing installs update themselves from inside the app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # ---- Manual run: just build (signed if secrets exist) ----
      - name: Build installers (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grab-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
